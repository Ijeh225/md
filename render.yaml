services:
  - type: web
    name: md-finance-control-prod
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: md-finance-control-prod-db
          property: connectionString

databases:
  - name: md-finance-control-prod-db
    databaseName: md_finance_control
    user: md_finance_user
    plan: free
