<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
:root{--red:#d7192f;--gold:#ffb81c;--ink:#2a0306;--green:#25d366}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Raleway,sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.full{position:absolute;inset:0}
#bg{background:radial-gradient(ellipse at 50% 45%,#7a0d18 0%,#2a040a 55%,#0a0102 100%)}
#rays{position:absolute;left:50%;top:50%;width:3400px;height:3400px;margin:-1700px 0 0 -1700px;background:repeating-conic-gradient(from 0deg,rgba(255,184,28,.07) 0deg 5deg,transparent 5deg 20deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 55%);mask:radial-gradient(circle,#000 0%,transparent 55%)}
#world{position:absolute;inset:0}
.photo{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;opacity:0}
#shade{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(10,1,2,.85) 0%,rgba(10,1,2,.55) 22%,transparent 38%,transparent 66%,rgba(10,1,2,.8) 82%,rgba(10,1,2,.9) 100%)}
.w{position:absolute;left:0;right:0;text-align:center;font-weight:900;opacity:0;text-shadow:0 8px 30px rgba(0,0,0,.8);line-height:1.06;padding:0 30px}
.gold{color:var(--gold)}
#lights{position:absolute;left:0;right:0;top:0;height:70px}
.bulb{position:absolute;width:30px;height:30px;border-radius:50%}
.flame{position:absolute;border-radius:50%;filter:blur(18px);mix-blend-mode:screen;opacity:0}
.spk{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd166;box-shadow:0 0 12px #ff7a1a;opacity:0}
.logo{position:absolute;left:390px;width:300px;opacity:0;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.bulk{position:absolute;left:70px;top:0;width:941px;opacity:0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.u{position:absolute;left:0;top:0;width:350px;height:357px;transform-origin:0 0;opacity:0}
.u .b{position:absolute;inset:0;background:rgba(255,255,255,.07);border-radius:22px;border:2px solid rgba(255,184,28,.35)}
.u img{position:absolute;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.chip{position:absolute;left:50%;top:1470px;transform:translateX(-50%);white-space:nowrap;background:var(--red);border:4px solid var(--gold);border-radius:999px;padding:12px 38px;font-weight:900;font-size:54px;opacity:0;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.price{position:absolute;left:50%;transform:translateX(-50%);opacity:0;white-space:nowrap}
.price div{background:var(--gold);color:var(--ink);font-weight:900;font-size:130px;line-height:1;border:8px solid #fff;border-radius:30px;padding:8px 44px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cnt{top:110px;font-size:280px;color:var(--gold);-webkit-text-stroke:7px #6e0613;text-shadow:0 0 60px rgba(255,150,0,.6)}
.phone{position:absolute;left:140px;top:330px;width:800px;height:900px;background:#0b0b0d;border-radius:60px;padding:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);opacity:0}
.sc{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#efe7dd}
.chd{height:112px;background:#075e54;display:flex;align-items:center;gap:20px;padding:0 26px}
.chd img{width:76px;height:76px;border-radius:50%;background:#fff;object-fit:contain}
.chd b{font-size:36px;font-weight:800}.chd small{display:block;font-size:24px;font-weight:600;opacity:.85}
.m{position:relative;display:block;width:fit-content;max-width:600px;margin:26px 22px 0;padding:18px 24px;border-radius:22px;font-size:40px;font-weight:700;line-height:1.28;color:#111;box-shadow:0 2px 4px rgba(0,0,0,.15);opacity:0}
.m.in{background:#fff;border-top-left-radius:6px;transform-origin:0 100%}
.m.out{background:#d9fdd3;border-top-right-radius:6px;margin-left:auto;transform-origin:100% 100%}
#end{position:absolute;inset:0;opacity:0;text-align:center}
#end .lg{position:absolute;left:400px;top:110px;width:280px}
#end .h{position:absolute;left:0;right:0;top:400px;font-weight:900;font-size:130px;line-height:1}
#end .tb{position:absolute;left:110px;right:110px;top:570px;background:rgba(0,0,0,.45);border:4px solid var(--gold);border-radius:30px;padding:16px 40px}
#end .tb div{display:flex;justify-content:space-between;font-weight:900;font-size:62px;padding:10px 0}
#end .tb div b{color:var(--gold)}
#end .ph{position:absolute;left:110px;right:110px;top:960px;background:var(--green);border-radius:999px;font-weight:900;font-size:76px;padding:18px 0}
#end .ur{position:absolute;left:110px;right:110px;top:1110px;background:var(--gold);color:var(--ink);border-radius:999px;font-weight:900;font-size:70px;padding:18px 0}
#end .q{position:absolute;left:110px;top:1270px;width:340px;background:#fff;border-radius:26px;padding:16px}
#end .q img{width:100%;display:block}
#end .qt{position:absolute;left:480px;right:90px;top:1290px;text-align:left;font-weight:900;font-size:58px;line-height:1.12}
#end .db{position:absolute;left:0;right:0;top:1670px;font-weight:900;font-size:60px;color:#ffe3a3}
#cap{position:absolute;left:40px;right:40px;top:1650px;text-align:center;font-weight:900;font-size:66px;line-height:1.12;text-transform:uppercase;opacity:0}
#cap span{display:inline-block;margin:0 9px;padding:2px 12px;border-radius:14px;background:rgba(0,0,0,.72)}
#cap span.on{background:var(--gold);color:var(--ink)}
.conf{position:absolute;width:18px;height:30px;opacity:0;border-radius:3px}
#pot{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;opacity:0}
#potshade{background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.3) 40%,rgba(0,0,0,.65));opacity:0}
#flash{background:#fff;opacity:0}
#vig{background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.6) 100%)}
#black{background:#000;opacity:0}
</style></head>
<body><div id="stage">
<div class="full" id="bg"><div id="rays"></div></div>
<img id="pot" src="pot/0001.jpg"><div class="full" id="potshade"></div>
<div id="world"><div id="photos"></div><div id="shade"></div><div id="layers"></div></div>
<div id="fire"></div>
<div id="texts"></div>
<div id="end">
  <img class="lg" src="img/logo.png"><div class="h">PARTY <span class="gold">PACKS</span></div>
  <div class="tb"><div><span>5 packs</span><b>₦25,000</b></div><div><span>10 packs</span><b>₦50,000</b></div><div><span>20 packs</span><b>₦100,000</b></div></div>
  <div class="ph">📞 0904 042 2964</div><div class="ur">spicyfood.com.ng →</div>
  <div class="q"><img src="img/qr.png"></div><div class="qt">Scan to<br>order on<br><span class="gold">WhatsApp</span></div>
  <div class="db">Order a day before your event!</div>
</div>
<div id="conf"></div><div id="lights"></div><div id="cap"></div>
<div class="full" id="vig"></div><div class="full" id="flash"></div><div class="full" id="black"></div>
</div>
<script>
const CFG=__CFG__;
const TOTAL=CFG.total; window.TOTAL=TOTAL;
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)), p=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-cl(x),3), ei=x=>Math.pow(cl(x),2.2), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=(x,c=1.7)=>{x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let seed=77; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const BC=['#ffd166','#3ad17a','#ff4d5e','#5ab8ff'];const bulbs=[];
for(let i=0;i<19;i++){const b=document.createElement('div');b.className='bulb';b.style.left=(18+i*58)+'px';b.style.top=(18+12*Math.sin(i*.9))+'px';b.style.background=BC[i%4];$('lights').appendChild(b);bulbs.push(b);}
const flames=[];for(let i=0;i<34;i++){const f=document.createElement('div');f.className='flame';const s=160+rnd()*260;f.style.width=s+'px';f.style.height=s*1.5+'px';f.style.background=`radial-gradient(ellipse,${rnd()<.5?'#ffb81c':'#ff4a12'},transparent 68%)`;$('fire').appendChild(f);flames.push({f,x:rnd()*1080,ph:rnd(),sp:.7+rnd()*.8,s});}
const spks=[];for(let i=0;i<50;i++){const s=document.createElement('div');s.className='spk';$('fire').appendChild(s);spks.push({s,x:rnd()*1080,ph:rnd(),sp:.4+rnd()*.7,dr:(rnd()-.5)*300});}
const conf=[];const CC=['#ffb81c','#d7192f','#fff3c4','#3ad17a','#ffffff'];
for(let i=0;i<90;i++){const c=document.createElement('div');c.className='conf';c.style.background=CC[i%5];$('conf').appendChild(c);conf.push({c,x:rnd()*1080,d:rnd(),v:420+rnd()*420,sw:rnd()*6,rot:rnd()*720});}
const F=['jollof','fried2','spag2','jollofchk'],D=['malt','fanta','coke','zobo'],SD=['salad','plantain'];
function lay(n){const cols=n===5?2:n===10?3:4, rows=Math.ceil(n/cols), w=n===5?350:n===10?268:212, h=w*1.02, g=n===5?16:12;
  const y0=330+(1110-(rows*h+(rows-1)*g))/2; const out=[];
  for(let i=0;i<n;i++){const r=Math.floor(i/cols), inrow=(r===rows-1)?n-r*cols:cols, c=i-r*cols; const rw=inrow*w+(inrow-1)*g;out.push({x:540-rw/2+c*(w+g), y:y0+r*(h+g), s:w/350});} return out;}
// build layers
const L=CFG.layers.map(o=>{const l={...o};
  if(o.type==='photo'){const e=document.createElement('img');e.className='photo';e.src=o.src;$('photos').appendChild(e);l.e=e;}
  else if(o.type==='text'||o.type==='counter'){const e=document.createElement('div');e.className='w'+(o.type==='counter'?' cnt':'');e.style.top=(o.top||150)+'px';if(o.size)e.style.fontSize=o.size+'px';e.innerHTML=o.html||'';$('texts').appendChild(e);l.e=e;}
  else if(o.type==='logo'){const e=document.createElement('img');e.className='logo';e.src='img/logo.png';e.style.top=(o.top||700)+'px';$('texts').appendChild(e);l.e=e;}
  else if(o.type==='bulk'){const e=document.createElement('img');e.className='bulk';e.src='img/bulk.png';$('layers').appendChild(e);l.e=e;}
  else if(o.type==='spread'){l.pos=lay(o.n);l.us=[];const st=o.n===5?.2:o.n===10?.1:.05;for(let i=0;i<o.n;i++){const u=document.createElement('div');u.className='u';
      u.innerHTML=`<div class="b"></div><img src="img/${F[i%4]}.png" style="left:3%;top:3%;width:60%;height:94%"><img src="img/${D[i%4]}.png" style="left:66%;top:3%;width:30%;height:56%"><img src="img/${SD[i%2]}.png" style="left:64%;top:62%;width:34%;height:34%">`;$('layers').appendChild(u);l.us.push({u,a:o.a+.15+i*st});}}
  else if(o.type==='price'){const e=document.createElement('div');e.className='price';e.style.top=(o.top||1440)+'px';e.innerHTML=`<div>${o.text}</div>`;$('texts').appendChild(e);l.e=e;}
  else if(o.type==='chips'){l.es=o.items.map(it=>{const e=document.createElement('div');e.className='chip';e.innerHTML=it[0];$('texts').appendChild(e);return e;});}
  else if(o.type==='chat'){const e=document.createElement('div');e.className='phone';e.innerHTML=`<div class="sc"><div class="chd"><img src="img/logo.png"><div><b>SpicyFood.CF</b><small>online</small></div></div>${o.msgs.map(m=>`<div class="m ${m[0]}">${m[1]}</div>`).join('')}</div>`;$('texts').appendChild(e);l.e=e;l.ms=[...e.querySelectorAll('.m')];}
  return l;});
function shake(t){let x=0,y=0;for(const [a,amp] of CFG.hits){const d=t-a;if(d>=0&&d<.45){const k=amp*Math.exp(-d*10);x+=k*Math.sin(d*90);y+=k*Math.cos(d*77);}}return [x,y];}
// captions
const WORDS=CFG.words;let CH=[];{let cur=[];for(let i=0;i<WORDS.length;i++){const w=WORDS[i];cur.push(w);const end=/[!?.]$/.test(w[2]),com=/,$/.test(w[2]);const nx=WORDS[i+1];const nxEnd=nx&&/[!?.]$/.test(nx[2]);if(end||(com&&cur.length>=2)||(cur.length>=4&&!nxEnd)||cur.length>=5){CH.push(cur);cur=[];}}if(cur.length)CH.push(cur);}
let lastCh=-1;
function caps(t){const c=$('cap');if(t>=CFG.end-.1){c.style.opacity=0;return;}let k=-1;for(let i=0;i<CH.length;i++){if(t>=CH[i][0][0]-.05)k=i;}if(k<0){c.style.opacity=0;return;}
  const ch=CH[k];const endT=(k+1<CH.length?Math.min(CH[k+1][0][0]-.05,ch[ch.length-1][1]+.6):ch[ch.length-1][1]+.5);if(t>endT){c.style.opacity=0;return;}
  if(k!==lastCh){c.innerHTML=ch.map(w=>`<span>${w[2].replace(/[,]$/,'')}</span>`).join('');lastCh=k;}
  c.style.opacity=1;[...c.children].forEach((s,i)=>{const on=t>=ch[i][0]-.03&&(i===ch.length-1||t<ch[i+1][0]-.03);s.className=on?'on':'';s.style.transform=on?'scale(1.12)':'scale(1)';});}
const pot=$('pot');let lastPot=-1;
async function setPot(idx){idx=Math.max(1,Math.min(321,idx));if(idx!==lastPot){pot.src=`pot/${String(idx).padStart(4,'0')}.jpg`;await pot.decode().catch(()=>{});lastPot=idx;}}
window.renderAsync=async function(t){
  $('rays').style.transform=`rotate(${t*6}deg)`;
  const [sx,sy]=shake(t);$('world').style.transform=`translate(${sx}px,${sy}px)`;
  bulbs.forEach((b,i)=>{const on=Math.floor(t*4+i)%2===0;b.style.opacity=on?1:.35;b.style.boxShadow=on?`0 0 22px ${BC[i%4]}`:'none';});
  let po=0,sh=0,fo=0;
  for(const l of L){const a=l.a,b=l.b;
    if(l.type==='photo'){const e=l.e;if(t<a||t>b+.3){e.style.opacity=0;continue;}const o=Math.min(a<=0?1:p(t,a,a+.25),1-p(t,b,b+.28));e.style.opacity=o;e.style.transform=`scale(${lerp(l.z0,l.z1,p(t,a,b))})`;sh=Math.max(sh,o);}
    else if(l.type==='pot'){if(t>=a&&t<b+.3){const o=Math.min(a<=0?1:p(t,a,a+.25),1-p(t,b,b+.28));po=Math.max(po,o);await setPot((l.from||1)+Math.floor((t-a)*30*.62));pot.style.transform=`scale(${1.05+.05*p(t,a,b)})`;}}
    else if(l.type==='fire'){if(t>=a-.1&&t<b+.4)fo=Math.max(fo,Math.min(p(t,a-.05,a+.25),1-p(t,b,b+.35)));}
    else if(l.type==='text'){const e=l.e;if(t<a||t>b+.3){e.style.opacity=0;continue;}const k=eb(p(t,a,a+.4),l.big?2.2:1.7);e.style.opacity=Math.min(cl(p(t,a,a+.08)),1-p(t,b,b+.22));e.style.transform=`scale(${l.big?2.4-1.4*k:.4+.6*k})`;}
    else if(l.type==='logo'){const e=l.e;if(t<a||t>b+.3){e.style.opacity=0;continue;}const k=eb(p(t,a,a+.45));e.style.opacity=Math.min(cl(p(t,a,a+.1)),1-p(t,b,b+.25));e.style.transform=`scale(${.3+.7*k})`;}
    else if(l.type==='bulk'){const e=l.e;if(t<a||t>b+.35){e.style.opacity=0;continue;}const k=eo(p(t,a,a+.5));const o=1-eio(p(t,b,b+.3));e.style.opacity=k*o;e.style.transform=`translateY(${lerp(1100,120,k)-p(t,a,b)*330}px)`;}
    else if(l.type==='spread'){const out=eio(p(t,b-.05,b+.3));l.us.forEach((o,i)=>{const u=o.u;if(t<o.a-.4||t>b+.35){u.style.opacity=0;return;}const pos=l.pos[i];const kin=ei(p(t,o.a-.4,o.a));const d=t-o.a;const sq=d>0?Math.exp(-d*9)*Math.sin(d*26):0;
        u.style.opacity=1-out;u.style.transform=`translate(${pos.x+(i%2?1:-1)*(1-kin)*200}px,${pos.y-(1-kin)*1500-out*200}px) scale(${pos.s*(1+.05*sq)*(1-.2*out)}) rotate(${(1-kin)*(i%2?10:-10)}deg)`;});}
    else if(l.type==='price'){const e=l.e;if(t<a-.05||t>b+.25){e.style.opacity=0;continue;}const k=eb(p(t,a-.05,a+.35),1.5);e.style.opacity=Math.min(cl(p(t,a-.05,a+.05)),1-p(t,b,b+.2));e.style.transform=`translateX(-50%) scale(${(2.4-1.4*k)*(t>a+.5?1+.025*Math.sin((t-a)*7):1)}) rotate(${-3*k}deg)`;}
    else if(l.type==='chips'){l.items.forEach((it,i)=>{const e=l.es[i],ca=it[1],cb=it[2];if(t<ca||t>cb+.3){e.style.opacity=0;return;}const k=eb(p(t,ca,ca+.4));e.style.opacity=Math.min(cl(p(t,ca,ca+.08)),1-p(t,cb,cb+.22));e.style.transform=`translateX(-50%) scale(${.4+.6*k})`;});}
    else if(l.type==='counter'){const e=l.e;if(t<a||t>b+.25){e.style.opacity=0;continue;}let v=l.steps[0][1];for(const [st,f,to] of l.steps){if(t>=st)v=Math.round(lerp(f,to,eo(p(t,st,st+.4))));}e.textContent=v;e.style.opacity=Math.min(cl(p(t,a,a+.1)),1-p(t,b,b+.2));
      const bump=Math.max(...l.steps.map(s=>{const d=t-s[0]-.3;return d>=0&&d<.3?Math.sin(d/.3*Math.PI):0}));e.style.transform=`scale(${1+.14*bump})`;}
    else if(l.type==='chat'){const e=l.e;if(t<a||t>b+.3){e.style.opacity=0;continue;}const k=eo(p(t,a,a+.4));e.style.opacity=Math.min(p(t,a,a+.2),1-p(t,b,b+.25));e.style.transform=`translateY(${(1-k)*900}px)`;
      l.ms.forEach((m,i)=>{const ma=l.msgs[i][2];const kk=eb(p(t,ma,ma+.3));m.style.opacity=t<ma?0:1;m.style.transform=`scale(${.3+.7*kk})`;});}
  }
  pot.style.opacity=po;$('potshade').style.opacity=po;$('shade').style.opacity=sh;
  for(const f of flames){const lt=((t*f.sp+f.ph)%1);f.f.style.opacity=fo*Math.sin(lt*Math.PI)*.85;f.f.style.transform=`translate(${f.x-f.s/2+Math.sin(t*5+f.ph*9)*30}px,${1920-f.s*.6-lt*520}px) scale(${1.1-.5*lt})`;}
  for(const s of spks){const lt=((t*s.sp+s.ph)%1);s.s.style.opacity=fo*(1-lt);s.s.style.transform=`translate(${s.x+s.dr*lt}px,${1900-lt*1500}px)`;}
  {const ot=t-CFG.end;const e=$('end');e.style.opacity=p(ot,0,.3);e.style.transform=`scale(${.92+.08*eo(p(ot,0,.5))})`;}
  for(const c of conf){let on=false;for(const ct of CFG.conf){const d=t-ct-c.d*.4;if(d>=0&&d<2.6){const y=-60+c.v*d*1.6,x=c.x+Math.sin(d*3+c.sw)*60;c.c.style.opacity=y<1980?1:0;c.c.style.transform=`translate(${x}px,${y}px) rotate(${c.rot+d*500}deg) rotateY(${d*400}deg)`;on=true;}}if(!on)c.c.style.opacity=0;}
  caps(t);
  let f=0;for(const [a,s] of CFG.flashes){const d=t-a;if(d>=-.04&&d<=.3)f=Math.max(f,(d<0?(1+d/.04):(1-d/.3))*s);}
  $('flash').style.opacity=f;
  $('black').style.opacity=Math.max(1-p(t,0,.05),p(t,TOTAL-.4,TOTAL));
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
</script></body></html>
