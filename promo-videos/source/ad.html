<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
:root{--red:#d7192f;--gold:#ffb81c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Raleway,sans-serif;background:#1a0306;color:#fff}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;--u:1vmin}
#bg{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%,#8a0f1e 0%,#4a050c 45%,#160204 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,184,28,.18) 1.2px,transparent 1.5px);background-size:calc(var(--u)*4.5) calc(var(--u)*4.5)}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:calc(var(--u)*42)}
.big{font-weight:900;font-size:calc(var(--u)*14);line-height:1.02;letter-spacing:-.02em}
.mid{font-weight:700;font-size:calc(var(--u)*5.2);line-height:1.25}
.gold{color:var(--gold)}
.card{position:relative;background:#fff;border-radius:calc(var(--u)*4);overflow:hidden;box-shadow:0 calc(var(--u)*2.5) calc(var(--u)*7) rgba(0,0,0,.45);flex:none}
.card img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain}
.tag{background:var(--red);font-weight:800;font-size:calc(var(--u)*3.3);letter-spacing:.14em;padding:calc(var(--u)*1.1) calc(var(--u)*2.6);border-radius:999px;white-space:nowrap}
.name{font-weight:900;font-size:calc(var(--u)*8.2);line-height:1.04;letter-spacing:-.01em}
.desc{font-weight:500;font-size:calc(var(--u)*3.8);opacity:.88;line-height:1.3}
.price{background:var(--gold);color:#2a0306;font-weight:900;font-size:calc(var(--u)*7.6);padding:calc(var(--u)*1.1) calc(var(--u)*3.2);border-radius:calc(var(--u)*2.2);white-space:nowrap}
.sp{background:var(--gold);color:#2a0306;font-weight:900;font-size:calc(var(--u)*4.6);padding:calc(var(--u)*.7) calc(var(--u)*2);border-radius:calc(var(--u)*1.6);white-space:nowrap}
.lbl{font-weight:800;font-size:calc(var(--u)*4.6);white-space:nowrap}

/* single dish */
.dish{display:flex;gap:calc(var(--u)*5);align-items:center;justify-content:center;width:100%;height:100%;padding:calc(var(--u)*6)}
.info{display:flex;flex-direction:column;gap:calc(var(--u)*2.4);align-items:flex-start;flex:1;min-width:0}
.v .dish{flex-direction:column}
.v .info{align-items:center;text-align:center;flex:none}
.v .dish .card{width:86vw;height:52vh}
.s .dish .card{width:46vw;height:78vh}
.l .dish .card{width:44vw;height:80vh}
.s .name{font-size:calc(var(--u)*6.4)}

/* trio + grid */
.multi{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:calc(var(--u)*5);gap:calc(var(--u)*3.2)}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*1.6)}
.head .name{font-size:calc(var(--u)*9)}
.l .head .name{font-size:calc(var(--u)*7.5)}
.row{display:flex;gap:calc(var(--u)*3.4);justify-content:center}
.item{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6)}
.item .meta{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2)}
.v .trio .row{flex-direction:column;gap:calc(var(--u)*2.6)}
.v .trio .item{flex-direction:row;gap:calc(var(--u)*4)}
.v .trio .item .meta{align-items:flex-start;width:38vw}
.v .trio .card{width:50vw;height:18vh}
.s .trio .card{width:28vw;height:34vh}
.s .lbl{font-size:calc(var(--u)*3.8)}
.s .trio .row{gap:calc(var(--u)*2.4)}
.l .trio .card{width:25vw;height:44vh}
.grid .row{flex-wrap:wrap}
.v .grid .row{width:92vw;row-gap:calc(var(--u)*3)}
.v .grid .card{width:43vw;height:24vh}
.s .grid .row{flex-wrap:nowrap;gap:calc(var(--u)*2.4)}
.s .grid .card{width:22vw;height:38vh}
.l .grid .card{width:20vw;height:42vh}
.wm{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*3);width:calc(var(--u)*15);opacity:0}
.s .wm,.l .wm{top:auto;bottom:calc(var(--u)*3)}
.cta-pill{background:#25d366;color:#fff;font-weight:800;font-size:calc(var(--u)*5.6);padding:calc(var(--u)*2) calc(var(--u)*5);border-radius:999px;display:flex;align-items:center;gap:calc(var(--u)*2)}
.areas{font-weight:700;font-size:calc(var(--u)*3.4);letter-spacing:.06em;opacity:.85;max-width:90vw}
.url{font-weight:800;font-size:calc(var(--u)*5.2);color:var(--gold)}
</style></head>
<body><div id="stage"><div id="bg"><div class="dots"></div></div><div id="scenes"></div>
<img class="wm" id="wm" src="imgs/logo.png"></div>
<script>
const W=innerWidth,H=innerHeight;
document.body.className = H>W*1.3?'v':(W>H*1.3?'l':'s');
const V=document.body.className==='v';
const S=[
 {type:'intro',dur:4},
 {type:'dish',dur:3.8,img:'jollof_half_chicken',tag:'BESTSELLER',name:'Jollof + Half Chicken',desc:'Smoky party jollof rice. Best value.',price:'₦3,500'},
 {type:'dish',dur:3.8,img:'jollof_big_turkey',tag:'JOLLOF RICE',name:'Jollof + Big Turkey',desc:'Smoky party jollof with a generous big turkey.',price:'₦6,000'},
 {type:'dish',dur:3.8,img:'jollof_fish',tag:'JOLLOF RICE',name:'Jollof + Fish',desc:'Smoky party jollof with well-seasoned fish.',price:'₦5,500'},
 {type:'dish',dur:3.8,img:'fried_rice_big_turkey',tag:'FRIED RICE',name:'Fried Rice + Big Turkey',desc:'Colourful fried rice with veggies and a big turkey.',price:'₦6,000'},
 {type:'dish',dur:3.8,img:'coconut_rice_full_chicken',tag:'COCONUT RICE',name:'Coconut Rice + Full Chicken',desc:'Creamy coconut rice with prawns and full chicken.',price:'₦6,500'},
 {type:'dish',dur:3.8,img:'spaghetti_big_turkey',tag:'PASTA',name:'Spaghetti + Big Turkey',desc:'Naija jollof spaghetti with a big turkey.',price:'₦4,000'},
 {type:'trio',dur:5.6,tag:'SOUP & SWALLOW',name:'Egusi Soup',desc:'Thick egusi soup with assorted meat.',
   items:[['egusi_garri','with Garri','₦5,000'],['egusi_semo','with Semo','₦6,000'],['egusi_pounded_yam','with Pounded Yam','₦7,000']]},
 {type:'trio',dur:5.6,tag:'SOUP & SWALLOW',name:'Vegetable Soup',desc:'Fresh vegetable soup with meat & fish.',
   items:[['veg_soup_garri','with Garri','₦5,000'],['veg_soup_semo','with Semo','₦6,000'],['veg_soup_pounded_yam','with Pounded Yam','₦7,000']]},
 {type:'trio',dur:5.6,tag:'SOUP & SWALLOW',name:'Okro Soup',desc:'Classic okro soup with assorted meat.',
   items:[['okro_garri','with Garri','₦5,000'],['okro_semo','with Semo','₦6,000'],['okro_pounded_yam','with Pounded Yam','₦7,000']]},
 {type:'dish',dur:4.2,img:'big_boss_combo',tag:'JUMBO COMBO',name:'Big Boss Combo',desc:'Rice or spaghetti, big turkey or chicken, salad or plantain + a cold drink.',price:'₦7,500'},
 {type:'dish',dur:4.0,img:'mini_odogwu',tag:'COMBO',name:'Mini Odogwu',desc:'Rice or spaghetti, turkey or chicken, salad or plantain + a cold drink.',price:'₦5,500'},
 {type:'grid',dur:5,tag:'EXTRAS',name:'Add something extra',desc:'',
   items:[['plantain','Plantain','₦500'],['goat_meat','Goat Meat','₦1,000'],['big_gizzard','Big Gizzard','₦1,500'],['salad','Salad','₦500']]},
 {type:'cta',dur:5.5},
];
const keep=new URLSearchParams(location.search).get('keep');
if(keep){const ks=keep.split(',').map(Number); const kept=S.filter((_,i)=>ks.includes(i)); S.length=0; S.push(...kept);}
let acc=0; for(const s of S){s.t0=acc; acc+=s.dur; s.t1=acc;} window.TOTAL=acc;
const host=document.getElementById('scenes');
const wa='<svg width="1em" height="1em" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.6-.1 1.2z"/></svg>';
S.forEach((s,k)=>{
  const id='s'+k; s.id=id; let h='';
  if(s.type==='intro') h=`<div class="center" style="gap:calc(var(--u)*4);padding:calc(var(--u)*6)">
    <img class="logo a" data-a="pop" data-d="0" src="imgs/logo.png">
    <div class="big a" data-a="pop" data-d=".7">Hungry<span class="gold">?</span></div>
    <div class="mid a" data-a="rise" data-d="1.4">Rich flavours, freshly made,<br>delivered fast.</div>
    <div class="tag a" data-a="rise" data-d="2.1">PREMIUM NIGERIAN MEALS · LAGOS</div></div>`;
  if(s.type==='dish') h=`<div class="dish"><div class="card a" data-a="slide" data-d="0"><img class="kb" src="menu_imgs/${s.img}.jpg"></div>
    <div class="info"><div class="tag a" data-a="rise" data-d=".4">${s.tag}</div><div class="name a" data-a="rise" data-d=".6">${s.name}</div>
    <div class="desc a" data-a="rise" data-d=".85">${s.desc}</div><div class="price a" data-a="pop" data-d="1.15">${s.price}</div></div></div>`;
  if(s.type==='trio'||s.type==='grid') h=`<div class="multi ${s.type}"><div class="head"><div class="tag a" data-a="rise" data-d="0">${s.tag}</div>
    <div class="name a" data-a="rise" data-d=".2">${s.name}</div>${s.desc?`<div class="desc a" data-a="rise" data-d=".4">${s.desc}</div>`:''}</div>
    <div class="row">${s.items.map((it,i)=>`<div class="item a" data-a="rise" data-d="${(.7+i*(s.type==='trio'?.55:.35)).toFixed(2)}">
      <div class="card"><img class="kb" src="menu_imgs/${it[0]}.jpg"></div><div class="meta"><div class="lbl">${it[1]}</div>
      <div class="sp a" data-a="pop" data-d="${(1.0+i*(s.type==='trio'?.55:.35)).toFixed(2)}">${it[2]}</div></div></div>`).join('')}</div></div>`;
  if(s.type==='cta') h=`<div class="center" style="gap:calc(var(--u)*3.8);padding:calc(var(--u)*6)">
    <img class="logo a" data-a="pop" data-d="0" src="imgs/logo.png" style="width:calc(var(--u)*34)">
    <div class="big a" data-a="rise" data-d=".4" style="font-size:calc(var(--u)*10)">Order in<br><span class="gold">20–30 mins</span></div>
    <div class="cta-pill a" data-a="pop" data-d="1.0" data-pulse="1">${wa}0904 042 2964</div>
    <div class="url a" data-a="rise" data-d="1.5">spicyfood.com.ng</div>
    <div class="areas a" data-a="rise" data-d="1.9">APAPA · SURULERE · YABA · IKEJA · LEKKI · VI · AND MORE</div></div>`;
  host.insertAdjacentHTML('beforeend',`<div class="scene" id="${id}">${h}</div>`);
  s.el=document.getElementById(id); s.anims=[...s.el.querySelectorAll('.a')]; s.kbs=[...s.el.querySelectorAll('.kb')];
});
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eb=x=>{x=cl(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const p=(t,a,b)=>cl((t-a)/(b-a));
window.render=function(t){
  document.getElementById('bg').style.transform=`scale(${1+.06*Math.sin(t*.3)}) translate(${Math.sin(t*.22)*2}%,${Math.cos(t*.18)*2}%)`;
  for(const s of S){
    const first=s.t0===0, last=s.t1===TOTAL;
    const fin=first?.01:.45, fout=last?.01:.45;
    const on=t>=s.t0&&t<=s.t1;
    if(!on){s.el.style.opacity=0;continue;}
    const lt=t-s.t0;
    s.el.style.opacity=Math.min(p(t,s.t0,s.t0+fin),1-p(t,s.t1-fout,s.t1));
    const out=eo(p(t,s.t1-.45,s.t1));
    for(const el of s.anims){
      const d=+el.dataset.d, a=el.dataset.a; let o,tf;
      if(a==='rise'){const k=eo(p(lt,d,d+.8)); o=k; tf=`translateY(${(1-k)*5}vmin)`;}
      else if(a==='pop'){const k=eb(p(lt,d,d+.75)); o=cl(p(lt,d,d+.25)); tf=`scale(${.5+.5*k})`;
        if(el.dataset.pulse&&lt>d+1) tf+=` scale(${1+.03*Math.sin((lt-d-1)*5)})`;}
      else if(a==='slide'){const k=eo(p(lt,d,d+1.0)); o=1; tf=`translateX(${(1-k)*(V?0:22) - out*12}vmin) translateY(${V?(1-k)*12:0}vmin) rotate(${(1-k)*4}deg)`; o=cl(p(lt,d,d+.4));}
      el.style.opacity=o; el.style.transform=tf;
    }
    for(const im of s.kbs){ im.style.transform=`scale(${1+.08*p(lt,0,s.dur)})`; }
  }
  const ex=S.find(s=>s.type==='cta').t0;
  const cur=S.find(s=>t>=s.t0&&t<s.t1)||S[S.length-1];
  const hideWm=document.body.className!=='v'&&(cur.type==='trio'||cur.type==='grid');
  document.getElementById('wm').style.opacity=hideWm?0:Math.min(p(t,4,4.5),1-p(t,ex-.4,ex))*.95;
};
window.__stills=S.map(s=>s.t0+Math.min(s.dur-.5,3.4));
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
render(0);
</script></body></html>
